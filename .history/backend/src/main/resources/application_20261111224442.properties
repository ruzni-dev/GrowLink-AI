spring.application.name=growlink-backend

server.port=8080

# Local development defaults to the XAMPP MySQL database. Override DB_URL for another environment.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/growlink_ai?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# JWT configuration. Use a strong secret; raw text and base64 values are both supported.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:900}

# Explainable recommendation weights. Scores are normalized across dimensions with available data.
app.recommendations.weights.skill=${RECOMMENDATION_WEIGHT_SKILL:0.40}
app.recommendations.weights.category=${RECOMMENDATION_WEIGHT_CATEGORY:0.15}
app.recommendations.weights.education=${RECOMMENDATION_WEIGHT_EDUCATION:0.15}
app.recommendations.weights.experience=${RECOMMENDATION_WEIGHT_EXPERIENCE:0.10}
app.recommendations.weights.location=${RECOMMENDATION_WEIGHT_LOCATION:0.08}
app.recommendations.weights.remote=${RECOMMENDATION_WEIGHT_REMOTE:0.04}
app.recommendations.weights.eligibility=${RECOMMENDATION_WEIGHT_ELIGIBILITY:0.03}
app.recommendations.weights.interest=${RECOMMENDATION_WEIGHT_INTEREST:0.03}
app.recommendations.weights.goals=${RECOMMENDATION_WEIGHT_GOALS:0.02}
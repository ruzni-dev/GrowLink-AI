spring.application.name=growlink-backend

server.port=8080

# Local development defaults to an in-memory database. Set DB_URL and DB_USERNAME to use MySQL.
spring.datasource.url=${DB_URL:jdbc:h2:mem:growlink_ai;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false